<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registro de Máquinas - Nuvem</title>

  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RegMáquinas">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2942/2942544.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    @media print {
      body * { visibility: hidden; }
      #printable-ticket, #printable-ticket * { visibility: visible; }
      #printable-ticket { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-screen overflow-hidden font-sans">

  <!-- LOGIN VIEW (Tela de Autenticação Inicial) -->
  <div id="view-login" class="fixed inset-0 bg-blue-600 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden p-6 space-y-6">
      <div class="text-center space-y-2">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-inner">
          <i class="fa-solid fa-desktop"></i>
        </div>
        <h2 class="font-bold text-slate-800 text-lg">Registo de Máquinas</h2>
        <p class="text-xs text-slate-500">Entre com as suas credenciais para aceder ao sistema</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Utilizador</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
            <input type="text" id="login-username" required placeholder="Ex: admin" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Senha</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="login-password" required placeholder="Sua senha" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div id="login-error" class="hidden text-red-500 text-xs text-center font-medium bg-red-50 p-2 rounded-lg border border-red-100">
          Utilizador ou senha incorretos.
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-3 rounded-xl shadow-md transition">
          Entrar no Sistema
        </button>
      </form>

      <div class="text-center text-[10px] text-slate-400 flex justify-between items-center px-2 pt-2 border-t">
        <span>Predefinido: admin / admin</span>
        <button type="button" onclick="forceResetSession()" class="text-blue-600 underline font-semibold">Limpar Sessão</button>
      </div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-blue-600 text-white shadow-md flex-none px-4 py-3 flex items-center justify-between z-10">
    <div class="flex items-center gap-3">
      <button id="btn-back" onclick="goBack()" class="hidden text-white hover:text-blue-100 text-lg">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h1 id="app-title" class="font-bold text-lg leading-tight truncate">Sistemas & Setores</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openExportModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow">
        <i class="fa-solid fa-file-excel"></i> Excel
      </button>
    </div>
  </header
