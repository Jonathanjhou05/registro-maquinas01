<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registro de Máquinas - Nuvem</title>

  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RegMáquinas">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2942/2942544.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-screen overflow-hidden font-sans">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white shadow-md flex-none px-4 py-3 flex items-center justify-between z-10">
    <div class="flex items-center gap-3">
      <button id="btn-back" onclick="goBack()" class="hidden text-white hover:text-blue-100 text-lg">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h1 id="app-title" class="font-bold text-lg leading-tight truncate">Sistemas & Setores</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openExportModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow">
        <i class="fa-solid fa-file-excel"></i> CSV
      </button>
    </div>
  </header>

  <!-- CONTENT CONTAINER -->
  <main class="flex-1 overflow-y-auto relative p-4 pb-24" id="main-container">
    
    <!-- VIEW 1: SECTORS LIST -->
    <section id="view-sectors" class="space-y-4">
      
      <!-- MELHORIA 1: BARRA DE PESQUISA GLOBAL -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" id="global-search" oninput="handleGlobalSearch(this.value)" placeholder="Pesquisar patrimônio, modelo ou observação..." class="w-full bg-white border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
      </div>

      <div class="flex justify-between items-center mb-2 pt-1">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Pastas de Setores</span>
        <button onclick="openFolderModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded-md flex items-center gap-1 shadow-sm">
          <i class="fa-solid fa-folder-plus"></i> Novo Setor
        </button>
      </div>

      <div id="sectors-list" class="grid grid-cols-1 gap-3">
        <div class="text-center py-10 bg-white rounded-xl border border-dashed border-slate-300 p-6">
          <i class="fa-solid fa-spinner fa-spin text-2xl text-blue-600 mb-2"></i>
          <p class="text-xs text-slate-500">A carregar dados...</p>
        </div>
      </div>
    </section>

    <!-- VIEW 2: ITEMS IN SECTOR -->
    <section id="view-items" class="hidden space-y-4">
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <h2 id="current-sector-title" class="font-bold text-base text-slate-800">Setor</h2>
          <p id="current-sector-count" class="text-xs text-slate-500">0 máquinas registradas</p>
        </div>
        <button onclick="openMachineModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1 shadow">
          <i class="fa-solid fa-plus"></i> Cadastrar
        </button>
      </div>

      <div id="items-list" class="space-y-3"></div>
    </section>

    <!-- VIEW 3: ADMIN / AUDIT LOGS & USER MANAGEMENT -->
    <section id="view-admin" class="hidden space-y-4">
      <div id="admin-restricted-box" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 text-center">
        <i class="fa-solid fa-lock text-3xl text-amber-500 mb-2"></i>
        <h3 class="font-bold text-slate-800 text-sm">Acesso Restrito ao Mestre</h3>
      </div>

      <div id="admin-panel" class="space-y-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <h3 class="font-bold text-xs text-slate-700 uppercase"><i class="fa-solid fa-users-gear mr-1 text-blue-600"></i> Gerenciar Utilizadores</h3>
            <button onclick="openUserModal()" class="bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded shadow-sm">+ Novo Usuário</button>
          </div>
          <div id="users-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <h3 class="font-bold text-xs text-slate-700 uppercase"><i class="fa-solid fa-list-check mr-1 text-blue-600"></i> Histórico de Auditoria</h3>
            <button onclick="loadAuditLogs()" class="text-xs text-blue-600 font-semibold"><i class="fa-solid fa-rotate"></i> Atualizar</button>
          </div>
          <div id="audit-logs-list" class="space-y-2 max-h-64 overflow-y-auto"></div>
        </div>
      </div>
    </section>

    <!-- VIEW 4: SETTINGS -->
    <section id="view-settings" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <h3 class="font-bold text-slate-800 mb-1 flex items-center gap-2">
          <i class="fa-solid fa-user-shield text-blue-600"></i> Sessão Atual
        </h3>
        <p class="text-xs text-slate-600">Conectado como: <strong id="current-user-display" class="text-blue-700">Administrador</strong></p>
        <p class="text-xs text-slate-600">Perfil: <strong id="current-role-display" class="uppercase text-slate-700">ADMIN</strong></p>
        <button onclick="handleLogout()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-semibold text-xs py-2.5 px-3 rounded-lg border border-red-200 mt-2">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Terminar Sessão (Logout)
        </button>
      </div>
    </section>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="bg-white border-t border-slate-200 flex-none fixed bottom-0 left-0 right-0 z-20 flex justify-around py-2 px-4 shadow-lg">
    <button onclick="switchTab('sectors')" id="nav-sectors" class="flex flex-col items-center gap-1 text-blue-600">
      <i class="fa-solid fa-folder-open text-lg"></i>
      <span class="text-[10px] font-medium">Setores</span>
    </button>
    <button onclick="switchTab('admin')" id="nav-admin" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600">
      <i class="fa-solid fa-shield-halved text-lg"></i>
      <span class="text-[10px] font-medium">Avaliar (ADM)</span>
    </button>
    <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600">
      <i class="fa-solid fa-gear text-lg"></i>
      <span class="text-[10px] font-medium">Ajustes</span>
    </button>
  </nav>

  <!-- MODAL: EXPORTAÇÃO CSV -->
  <div id="modal-export" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md shadow-xl overflow-hidden flex flex-col max-h-[85vh]">
      <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-emerald-50">
        <h3 class="font-bold text-emerald-800 text-sm"><i class="fa-solid fa-file-excel mr-1.5"></i> Exportar Relatório Planilha</h3>
        <button onclick="closeExportModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-5 space-y-4 overflow-y-auto flex-1 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-2">Selecionar Pastas/Setores para incluir:</label>
          <div class="flex gap-2 mb-3">
            <button type="button" onclick="toggleSelectAllExport(true)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded font-semibold">Marcar Todos</button>
            <button type="button" onclick="toggleSelectAllExport(false)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded font-semibold">Desmarcar Todos</button>
          </div>
          <div id="export-sectors-checkboxes" class="space-y-2 border border-slate-200 rounded-xl p-3 max-h-40 overflow-y-auto bg-slate-50"></div>
        </div>
      </div>
      <div class="p-4 border-t border-slate-100 flex-none bg-slate-50 flex justify-end gap-2">
        <button type="button" onclick="closeExportModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
        <button type="button" onclick="generateAndDownloadCSV()" class="px-5 py-2 text-xs font-bold text-white bg-emerald-600
