<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registro de Máquinas - Nuvem</title>

  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RegMáquinas">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2942/2942544.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-screen overflow-hidden font-sans">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white shadow-md flex-none px-4 py-3 flex items-center justify-between z-10">
    <div class="flex items-center gap-3">
      <button id="btn-back" onclick="goBack()" class="hidden text-white hover:text-blue-100 text-lg">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h1 id="app-title" class="font-bold text-lg leading-tight truncate">Sistemas & Setores</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openExportModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow">
        <i class="fa-solid fa-file-excel"></i> CSV
      </button>
    </div>
  </header>

  <!-- CONTENT CONTAINER -->
  <main class="flex-1 overflow-y-auto relative p-4 pb-24" id="main-container">
    
    <!-- VIEW 1: SECTORS LIST -->
    <section id="view-sectors" class="space-y-4">
      
      <!-- BARRA DE PESQUISA GLOBAL SEGURA -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" id="global-search" oninput="handleGlobalSearch(this.value)" placeholder="Pesquisar patrimônio, modelo ou observação..." class="w-full bg-white border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
      </div>

      <div class="flex justify-between items-center mb-2 pt-1">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Pastas de Setores</span>
        <button onclick="openFolderModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded-md flex items-center gap-1 shadow-sm">
          <i class="fa-solid fa-folder-plus"></i> Novo Setor
        </button>
      </div>

      <div id="sectors-list" class="grid grid-cols-1 gap-3">
        <div class="text-center py-10 bg-white rounded-xl border border-dashed border-slate-300 p-6">
          <i class="fa-solid fa-spinner fa-spin text-2xl text-blue-600 mb-2"></i>
          <p class="text-xs text-slate-500">A carregar dados...</p>
        </div>
      </div>
    </section>

    <!-- VIEW 2: ITEMS IN SECTOR -->
    <section id="view-items" class="hidden space-y-4">
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <h2 id="current-sector-title" class="font-bold text-base text-slate-800">Setor</h2>
          <p id="current-sector-count" class="text-xs text-slate-500">0 máquinas registradas</p>
        </div>
        <button onclick="openMachineModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1 shadow">
          <i class="fa-solid fa-plus"></i> Cadastrar
        </button>
      </div>

      <div id="items-list" class="space-y-3"></div>
    </section>

    <!-- VIEW 3: ADMIN / AUDIT LOGS & USER MANAGEMENT -->
    <section id="view-admin" class="hidden space-y-4">
      <div id="admin-restricted-box" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 text-center">
        <i class="fa-solid fa-lock text-3xl text-amber-500 mb-2"></i>
        <h3 class="font-bold text-slate-800 text-sm">Acesso Restrito ao Mestre</h3>
      </div>

      <div id
