<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfraGest - Gestão de Ativos de TI</title>
  
  <!-- Configurações de PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="InfraGest">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- Cabeçalho Principal -->
  <header class="bg-blue-600 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <!-- Substitua pelo caminho do seu logo se necessário -->
        <div class="bg-white text-blue-600 p-2 rounded-lg font-bold text-xl">IG</div>
        <div>
          <h1 class="text-xl font-bold">InfraGest</h1>
          <p class="text-xs text-blue-100">Gestão de Inventário e Suporte Técnico</p>
        </div>
      </div>

      <!-- Ações de Sincronização e Indicador Offline -->
      <div class="flex items-center gap-3">
        <button onclick="syncPendingData()" class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition shadow">
          <i data-lucide="cloud-sync" class="w-4 h-4"></i>
          <span>Sync Sheets</span>
          <span id="pendingCount" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full" style="display: none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Registo de Equipamento</h2>
      
      <!-- Formulário de Registo -->
      <form id="machineForm" onsubmit="handleFormSubmit(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Andar (Andar/Setor)</label>
          <input type="text" id="floor" required placeholder="Ex: 1º ANDAR" class="w-full border border-gray-300 rounded-lg p-2 uppercase text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Setor</label>
          <input type="text" id="sector" required placeholder="Ex: INFORMATICA" class="w-full border border-gray-300 rounded-lg p-2 uppercase text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nº Ticket</label>
          <input type="text" id="ticket" placeholder="Ex: INF-001" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Etiqueta Gabinete</label>
          <input type="text" id="code" required placeholder="Ex: GAB-01" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Etiqueta Monitor</label>
          <input type="text" id="monitor" placeholder="Ex: MON-01" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Modelo</label>
          <input type="text" id="model" placeholder="Ex: Dell OptiPlex" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Sistema Operativo (SO)</label>
          <input type="text" id="os" placeholder="Ex: Windows 11 Pro" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
          <select id="status" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
            <option value="Operacional">Operacional</option>
            <option value="Manutenção">Manutenção</option>
            <option value="Inativo">Inativo</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Periféricos</label>
          <input type="text" id="peripherals" placeholder="Ex: Teclado, Rato" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
        </div>
        <div class="md:col-span-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">Observações</label>
          <textarea id="notes" rows="2" placeholder="Detalhes adicionais..." class="w-full border border-gray-300 rounded-lg p-2 text-sm"></textarea>
        </div>
        <div class="md:col-span-3 flex justify-end">
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium text-sm shadow transition">
            Guardar Registo
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="text-center py-4 text-xs text-gray-500">
    InfraGest PWA &bull; Sistema de Gestão de Ativos
  </footer>

  <!-- Scripts de Lógica e Sincronização -->
  <script>
    // URL do Webhook do Apps Script configurado na sua nova planilha
    const GOOGLE_SHEETS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbx3Jz4VREtEiSckdggjJquts1uTBlsTVQoFWLE3JOafdksrbq935_z8mBxL8PkESqc/exec";

    // Inicializar ícones Lucide
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      updatePendingBadge();
    });

    // Registar o Service Worker para suporte PWA Offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registado:', reg.scope))
          .catch(err => console.error('Erro ao registar Service Worker:', err));
      });
    }

    // Monitorar estado da rede
    window.addEventListener('online', () => {
      console.log("Conectado à internet. Sincronizando...");
      syncPendingData();
    });

    window.addEventListener('offline', () => {
      console.log("Modo offline ativado.");
    });

    // Submissão do Formulário
    async function handleFormSubmit(event) {
      event.preventDefault();

      const machineData = {
        floor: document.getElementById('floor').value.trim().toUpperCase(),
        sector: document.getElementById('sector').value.trim().toUpperCase(),
        ticket: document.getElementById('ticket').value.trim(),
        code: document.getElementById('code').value.trim(),
        monitor: document.getElementById('monitor').value.trim(),
        model: document.getElementById('model').value.trim(),
        os: document.getElementById('os').value.trim(),
        status: document.getElementById('status').value,
        peripherals: document.getElementById('peripherals').value.trim(),
        notes: document.getElementById('notes').value.trim(),
        date: new Date().toLocaleDateString('pt-BR')
      };

      if (navigator.onLine) {
        try {
          // Envio imediato se estiver online
          await fetch(GOOGLE_SHEETS_WEBHOOK_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify([machineData])
          });
          alert("Registo guardado e enviado com sucesso para o Sheets!");
          document.getElementById('machineForm').reset();
        } catch (error) {
          console.error("Erro ao enviar online, guardando localmente:", error);
          saveOffline(machineData);
        }
      } else {
        // Guardar na fila offline se não houver rede
        saveOffline(machineData);
        alert("Sem conexão! Registo guardado localmente e será sincronizado depois.");
        document.getElementById('machineForm').reset();
      }
    }

    // Guardar dados em cache local
    function saveOffline(machineData) {
      let pending = JSON.parse(localStorage.getItem('pendingSync') || '[]');
      pending.push(machineData);
      localStorage.setItem('pendingSync', JSON.stringify(pending));
      updatePendingBadge();
    }

    // Atualizar contador visual de pendentes
    function updatePendingBadge() {
      const pending = JSON.parse(localStorage.getItem('pendingSync') || '[]');
      const badge = document.getElementById('pendingCount');
      if (badge) {
        badge.innerText = pending.length;
        badge.style.display = pending.length > 0 ? 'inline-block' : 'none';
      }
    }

    // Sincronizar itens pendentes quando o botão for clicado ou voltar a online
    async function syncPendingData() {
      const pending = JSON.parse(localStorage.getItem('pendingSync') || '[]');
      if (pending.length === 0) {
        alert("Todos os dados já estão sincronizados com a planilha!");
        return;
      }

      if (!navigator.onLine) {
        alert("Ainda se encontra sem ligação à internet. Não é possível sincronizar.");
        return;
      }

      try {
        const response = await fetch(GOOGLE_SHEETS_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pending)
        });

        localStorage.removeItem('pendingSync');
        updatePendingBadge();
        alert(`Sincronização bem-sucedida! ${pending.length} registo(s) enviados para o Google Sheets.`);
      } catch (error) {
        console.error("Erro na sincronização:", error);
        alert("Falha ao sincronizar dados pendentes. Tente novamente mais tarde.");
      }
    }
  </script>
</body>
</html>
