<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registro de Máquinas</title>

  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RegMáquinas">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2942/2942544.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- SheetJS (XLSX Export) -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-screen overflow-hidden font-sans">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white shadow-md flex-none px-4 py-3 flex items-center justify-between z-10">
    <div class="flex items-center gap-3">
      <button id="btn-back" onclick="goBack()" class="hidden text-white hover:text-blue-100 text-lg">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h1 id="app-title" class="font-bold text-lg leading-tight truncate">Sistemas & Setores</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="exportToExcel()" class="bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow">
        <i class="fa-solid fa-file-excel"></i> Exportar
      </button>
    </div>
  </header>

  <!-- CONTENT CONTAINER -->
  <main class="flex-1 overflow-y-auto relative p-4 pb-24" id="main-container">
    
    <!-- VIEW 1: SECTORS LIST -->
    <section id="view-sectors" class="space-y-4">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Pastas de Setores</span>
        <button onclick="openFolderModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded-md flex items-center gap-1 shadow-sm">
          <i class="fa-solid fa-folder-plus"></i> Novo Setor
        </button>
      </div>

      <div id="sectors-list" class="grid grid-cols-1 gap-3">
        <!-- Folders rendered here -->
      </div>
    </section>

    <!-- VIEW 2: ITEMS IN SECTOR -->
    <section id="view-items" class="hidden space-y-4">
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <h2 id="current-sector-title" class="font-bold text-base text-slate-800">Setor</h2>
          <p id="current-sector-count" class="text-xs text-slate-500">0 máquinas registradas</p>
        </div>
        <button onclick="openMachineModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1 shadow">
          <i class="fa-solid fa-plus"></i> Cadastrar
        </button>
      </div>

      <div id="items-list" class="space-y-3">
        <!-- Machines rendered here -->
      </div>
    </section>

    <!-- VIEW 3: SETTINGS & BACKUP -->
    <section id="view-settings" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h3 class="font-bold text-slate-800 mb-2 flex items-center gap-2">
          <i class="fa-solid fa-database text-blue-600"></i> Backup & Dados
        </h3>
        <p class="text-xs text-slate-600 mb-4">Gerencie as informações salvas localmente neste dispositivo.</p>

        <div class="space-y-2">
          <button onclick="exportBackupJSON()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs py-2.5 px-3 rounded-lg border border-slate-300 flex items-center justify-between">
            <span><i class="fa-solid fa-download mr-2"></i> Baixar Backup em JSON</span>
            <i class="fa-solid fa-chevron-right text-slate-400"></i>
          </button>

          <label class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs py-2.5 px-3 rounded-lg border border-slate-300 flex items-center justify-between cursor-pointer">
            <span><i class="fa-solid fa-upload mr-2"></i> Restaurar Backup</span>
            <input type="file" id="import-json" accept=".json" class="hidden" onchange="importBackupJSON(event)">
            <i class="fa-solid fa-chevron-right text-slate-400"></i>
          </label>

          <button onclick="clearAllData()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-semibold text-xs py-2.5 px-3 rounded-lg border border-red-200 flex items-center justify-between mt-4">
            <span><i class="fa-solid fa-trash-can mr-2"></i> Apagar Todos os Dados</span>
            <i class="fa-solid fa-triangle-exclamation"></i>
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="bg-white border-t border-slate-200 flex-none fixed bottom-0 left-0 right-0 z-20 flex justify-around py-2 px-4 shadow-lg">
    <button onclick="switchTab('sectors')" id="nav-sectors" class="flex flex-col items-center gap-1 text-blue-600">
      <i class="fa-solid fa-folder-open text-lg"></i>
      <span class="text-[10px] font-medium">Setores</span>
    </button>
    <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600">
      <i class="fa-solid fa-gear text-lg"></i>
      <span class="text-[10px] font-medium">Ajustes</span>
    </button>
  </nav>

  <!-- MODAL: ADD/EDIT SECTOR -->
  <div id="modal-folder" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm shadow-xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center">
        <h3 id="modal-folder-title" class="font-bold text-slate-800">Novo Setor</h3>
        <button onclick="closeFolderModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="saveFolder(event)" class="p-5 space-y-4">
        <input type="hidden" id="folder-id">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nome do Setor / Pasta</label>
          <input type="text" id="folder-name" required placeholder="Ex: TI, Recepção, RH..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeFolderModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ADD MACHINE -->
  <div id="modal-machine" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl w-full max-w-md shadow-xl overflow-hidden my-auto max-h-[90vh] flex flex-col">
      <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center flex-none">
        <h3 class="font-bold text-slate-800">Cadastrar Máquina</h3>
        <button onclick="closeMachineModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form onsubmit="saveMachine(event)" class="p-5 space-y-4 overflow-y-auto flex-1">
        
        <!-- TAG CODE + SCANNER BUTTON -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Etiqueta / Patrimônio</label>
          <div class="flex gap-2">
            <input type="text" id="machine-code" required placeholder="Digite ou escaneie o código" class="flex-1 border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono font-bold text-blue-800">
            <button type="button" onclick="startScanner()" class="bg-slate-800 hover:bg-slate-900 text-white px-3.5 py-2.5 rounded-lg flex items-center gap-1.5 text-xs font-semibold shadow flex-none">
              <i class="fa-solid fa-barcode text-sm"></i> Ler Código
            </button>
          </div>
        </div>

        <!-- QR / BARCODE SCANNER CONTAINER -->
        <div id="scanner-container" class="hidden border-2 border-dashed border-blue-400 p-2 rounded-xl bg-slate-50 relative">
          <div id="reader" class="w-full"></div>
          <button type="button" onclick="stopScanner()" class="mt-2 w-full bg-red-100 text-red-600 text-xs font-bold py-1.5 rounded-lg">
            Fechar Leitor
          </button>
        </div>

        <!-- PHOTO CAPTURE -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Foto do Equipamento / Etiqueta</label>
          <label class="w-full bg-slate-50 hover:bg-slate-100 border border-slate-300 rounded-lg p-3 text-center cursor-pointer text-slate-700 text-xs font-semibold flex items-center justify-center gap-2">
            <i class="fa-solid fa-camera text-blue-600 text-base"></i>
            <span id="photo-label-text">Tirar ou Anexar Foto</span>
            <input type="file" id="machine-photo" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)" class="hidden">
          </label>
          <div id="photo-preview-container" class="mt-2 hidden relative">
            <img id="photo-preview" class="w-full h-36 object-cover rounded-lg border border-slate-200 shadow-inner">
            <button type="button" onclick="removeCapturedPhoto()" class="absolute top-2 right-2 bg-red-600 text-white p-1.5 rounded-full text-xs shadow-md">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>

        <!-- MODEL / DESCRIPTION -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Modelo / Tipo de Equipamento</label>
          <input type="text" id="machine-model" placeholder="Ex: Dell Optiplex, Impressora HP..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- STATUS -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Estado de Funcionamento</label>
          <select id="machine-status" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="Operacional">Operacional / Em uso</option>
            <option value="Manutenção">Em Manutenção</option>
            <option value="Defeito">Com Defeito / Inativo</option>
            <option value="Novo">Novo / A instalar</option>
          </select>
        </div>

        <!-- NOTES -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Observações</label>
          <textarea id="machine-notes" rows="2" placeholder="Detalhes adicionais..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <!-- ACTIONS -->
        <div class="flex justify-end gap-2 pt-2 border-t border-slate-100 flex-none">
          <button type="button" onclick="closeMachineModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-5 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow">Salvar Registro</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: VIEW PHOTO FULLSCREEN -->
  <div id="modal-image-view" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col justify-between p-4" onclick="closeImageView()">
    <div class="flex justify-between items-center text-white">
      <span id="image-modal-title" class="text-xs font-medium">Foto do Equipamento</span>
      <button onclick="closeImageView()" class="text-white text-xl p-2"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="flex-1 flex items-center justify-center p-2">
      <img id="full-size-image" class="max-h-[80vh] max-w-full object-contain rounded-lg">
    </div>
    <div class="text-center text-slate-400 text-xs py-2">Toque em qualquer lugar para fechar</div>
  </div>

  <!-- APPLICATION JAVASCRIPT -->
  <script>
    // INDEXEDDB SETUP FOR IMAGE STORAGE
    let db;
    const request = indexedDB.open("RegMaquinasImagesDB", 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("images")) {
        db.createObjectStore("images", { keyPath: "id" });
      }
    };
    request.onsuccess = (e) => { db = e.target.result; };
    request.onerror = (e) => console.error("Erro no IndexedDB", e);

    function saveImageToDB(id, base64) {
      return new Promise((resolve, reject) => {
        if(!db) return resolve();
        const tx = db.transaction("images", "readwrite");
        const store = tx.objectStore("images");
        store.put({ id: id, data: base64 });
        tx.oncomplete = () => resolve();
        tx.onerror = (err) => reject(err);
      });
    }

    function getImageFromDB(id) {
      return new Promise((resolve) => {
        if(!db) return resolve(null);
        const tx = db.transaction("images", "readonly");
        const store = tx.objectStore("images");
        const req = store.get(id);
        req.onsuccess = () => resolve(req.result ? req.result.data : null);
        req.onerror = () => resolve(null);
      });
    }

    function deleteImageFromDB(id) {
      if(!db) return;
      const tx = db.transaction("images", "readwrite");
      tx.objectStore("images").delete(id);
    }

    // STATE MANAGEMENT
    let sectors = JSON.parse(localStorage.getItem('reg_sectors')) || [];
    let machines = JSON.parse(localStorage.getItem('reg_machines')) || [];
    let currentSectorId = null;
    let currentTempPhoto = null;
    let html5QrcodeScanner = null;

    // INITIALIZATION
    window.onload = () => {
      renderSectors();
    };

    function saveData() {
      localStorage.setItem('reg_sectors', JSON.stringify(sectors));
      localStorage.setItem('reg_machines', JSON.stringify(machines));
    }

    // NAVIGATION
    function switchTab(tab) {
      document.getElementById('view-sectors').classList.add('hidden');
      document.getElementById('view-items').classList.add('hidden');
      document.getElementById('view-settings').classList.add('hidden');
      document.getElementById('btn-back').classList.add('hidden');

      document.getElementById('nav-sectors').className = "flex flex-col items-center gap-1 text-slate-400";
      document.getElementById('nav-settings').className = "flex flex-col items-center gap-1 text-slate-400";

      if(tab === 'sectors') {
        document.getElementById('view-sectors').classList.remove('hidden');
        document.getElementById('nav-sectors').className = "flex flex-col items-center gap-1 text-blue-600";
        document.getElementById('app-title').innerText = "Sistemas & Setores";
        currentSectorId = null;
        renderSectors();
      } else if(tab === 'settings') {
        document.getElementById('view-settings').classList.remove('hidden');
        document.getElementById('nav-settings').className = "flex flex-col items-center gap-1 text-blue-600";
        document.getElementById('app-title').innerText = "Configurações";
      }
    }

    function goBack() {
      switchTab('sectors');
    }

    // SECTORS / FOLDERS
    function renderSectors() {
      const container = document.getElementById('sectors-list');
      container.innerHTML = '';

      if (sectors.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 bg-white rounded-xl border border-dashed border-slate-300 p-6">
            <i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i>
            <p class="text-sm font-semibold text-slate-600">Nenhum setor cadastrado</p>
            <p class="text-xs text-slate-400 mt-1">Crie pastas para organizar as máquinas por locais de atendimento.</p>
          </div>
        `;
        return;
      }

      sectors.forEach(sec => {
        const count = machines.filter(m => m.sectorId === sec.id).length;
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between active:scale-[0.99] transition-transform cursor-pointer";
        card.onclick = () => openSectorItems(sec.id);
        
        card.innerHTML = `
          <div class="flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-lg flex-none">
              <i class="fa-solid fa-folder"></i>
            </div>
            <div>
              <h3 class="font-bold text-slate-800 text-sm leading-tight">${sec.name}</h3>
              <span class="text-xs text-slate-500">${count} máquina${count !== 1 ? 's' : ''}</span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="event.stopPropagation(); editFolder('${sec.id}')" class="p-2 text-slate-400 hover:text-slate-600 text-xs">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button onclick="event.stopPropagation(); deleteFolder('${sec.id}')" class="p-2 text-slate-400 hover:text-red-500 text-xs">
              <i class="fa-solid fa-trash-can"></i>
            </button>
            <i class="fa-solid fa-chevron-right text-slate-300 text-xs ml-1"></i>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openFolderModal() {
      document.getElementById('folder-id').value = '';
      document.getElementById('folder-name').value = '';
      document.getElementById('modal-folder-title').innerText = 'Novo Setor';
      document.getElementById('modal-folder').classList.remove('hidden');
    }

    function closeFolderModal() {
      document.getElementById('modal-folder').classList.add('hidden');
    }

    function saveFolder(e) {
      e.preventDefault();
      const id = document.getElementById('folder-id').value;
      const name = document.getElementById('folder-name').value.trim();

      if (!name) return;

      if (id) {
        const sec = sectors.find(s => s.id === id);
        if (sec) sec.name = name;
      } else {
        sectors.push({
          id: 'sec_' + Date.now(),
          name: name
        });
      }

      saveData();
      closeFolderModal();
      renderSectors();
    }

    function editFolder(id) {
      const sec = sectors.find(s => s.id === id);
      if (!sec) return;
      document.getElementById('folder-id').value = sec.id;
      document.getElementById('folder-name').value = sec.name;
      document.getElementById('modal-folder-title').innerText = 'Renomear Setor';
      document.getElementById('modal-folder').classList.remove('hidden');
    }

    function deleteFolder(id) {
      const sec = sectors.find(s => s.id === id);
      if (!sec) return;
      if (confirm(`Tem certeza que deseja excluir o setor "${sec.name}" e todas as suas máquinas cadastradas?`)) {
        const related = machines.filter(m => m.sectorId === id);
        related.forEach(m => {
          if(m.photoId) deleteImageFromDB(m.photoId);
        });

        machines = machines.filter(m => m.sectorId !== id);
        sectors = sectors.filter(s => s.id !== id);
        saveData();
        renderSectors();
      }
    }

    // MACHINES IN SECTOR
    function openSectorItems(sectorId) {
      currentSectorId = sectorId;
      const sec = sectors.find(s => s.id === sectorId);
      if (!sec) return;

      document.getElementById('view-sectors').classList.add('hidden');
      document.getElementById('view-settings').classList.add('hidden');
      document.getElementById('view-items').classList.remove('hidden');
      document.getElementById('btn-back').classList.remove('hidden');

      document.getElementById('app-title').innerText = sec.name;
      document.getElementById('current-sector-title').innerText = sec.name;

      renderMachines();
    }

    async function renderMachines() {
      const container = document.getElementById('items-list');
      container.innerHTML = '';

      const sectorMachines = machines.filter(m => m.sectorId === currentSectorId);
      document.getElementById('current-sector-count').innerText = `${sectorMachines.length} máquina${sectorMachines.length !== 1 ? 's' : ''} registrada${sectorMachines.length !== 1 ? 's' : ''}`;

      if (sectorMachines.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 bg-white rounded-xl border border-dashed border-slate-300 p-6">
            <i class="fa-solid fa-desktop text-3xl text-slate-300 mb-2"></i>
            <p class="text-sm font-semibold text-slate-600">Nenhuma máquina cadastrada</p>
            <p class="text-xs text-slate-400 mt-1">Clique em "Cadastrar" para adicionar equipamentos.</p>
          </div>
        `;
        return;
      }

      for (const m of sectorMachines) {
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-2";

        let photoHtml = `<div class="w-14 h-14 rounded-lg bg-slate-100 flex items-center justify-center text-slate-300 text-xl flex-none"><i class="fa-solid fa-desktop"></i></div>`;
        
        if (m.photoId) {
          const imgData = await getImageFromDB(m.photoId);
          if (imgData) {
            photoHtml = `<img src="${imgData}" onclick="openImageView('${imgData}', '${m.code}')" class="w-14 h-14 rounded-lg object-cover flex-none border border-slate-200 cursor-pointer">`;
          }
        }

        let statusBadge = 'bg-slate-100 text-slate-600';
        if(m.status === 'Operacional') statusBadge = 'bg-emerald-50 text-emerald-700 border-emerald-200';
        if(m.status === 'Manutenção') statusBadge = 'bg-amber-50 text-amber-700 border-amber-200';
        if(m.status === 'Defeito') statusBadge = 'bg-red-50 text-red-700 border-red-200';

        card.innerHTML = `
          <div class="flex items-start gap-3">
            ${photoHtml}
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-1">
                <span class="font-mono font-bold text-blue-700 text-sm truncate">${m.code}</span>
                <span class="text-[10px] px-2 py-0.5 rounded-full border ${statusBadge} font-medium">${m.status || 'N/I'}</span>
              </div>
              <p class="text-xs font-medium text-slate-800 truncate mt-0.5">${m.model || 'Modelo não especificado'}</p>
              ${m.notes ? `<p class="text-[11px] text-slate-500 truncate mt-1"><i class="fa-regular fa-comment text-[10px] mr-1"></i>${m.notes}</p>` : ''}
            </div>
          </div>
          <div class="flex items-center justify-between border-t border-slate-100 pt-2 mt-1 text-[11px] text-slate-400">
            <span><i class="fa-regular fa-clock mr-1"></i>${m.date}</span>
            <button onclick="deleteMachine('${m.id}')" class="text-red-500 hover:text-red-700 font-medium px-2 py-1">
              <i class="fa-solid fa-trash-can mr-1"></i>Excluir
            </button>
          </div>
        `;
        container.appendChild(card);
      }
    }

    // ADD MACHINE
    function openMachineModal() {
      document.getElementById('machine-code').value = '';
      document.getElementById('machine-model').value = '';
      document.getElementById('machine-status').value = 'Operacional';
      document.getElementById('machine-notes').value = '';
      removeCapturedPhoto();
      stopScanner();
      document.getElementById('modal-machine').classList.remove('hidden');
    }

    function closeMachineModal() {
      stopScanner();
      document.getElementById('modal-machine').classList.add('hidden');
    }

    // PHOTO UPLOAD
    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 900;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          currentTempPhoto = canvas.toDataURL('image/jpeg', 0.8);
          
          document.getElementById('photo-preview').src = currentTempPhoto;
          document.getElementById('photo-preview-container').classList.remove('hidden');
          document.getElementById('photo-label-text').innerText = 'Trocar Foto';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeCapturedPhoto() {
      currentTempPhoto = null;
      document.getElementById('machine-photo').value = '';
      document.getElementById('photo-preview').src = '';
      document.getElementById('photo-preview-container').classList.add('hidden');
      document.getElementById('photo-label-text').innerText = 'Tirar ou Anexar Foto';
    }

    // BARCODE / QR CODE SCANNER
    function startScanner() {
      const container = document.getElementById('scanner-container');
      container.classList.remove('hidden');

      if (html5QrcodeScanner) {
        stopScanner();
      }

      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          document.getElementById('machine-code').value = decodedText;
          stopScanner();
        },
        () => {}
      ).catch(err => {
        alert("Não foi possível acessar a câmera para leitura. Digite o código manualmente.");
        stopScanner();
      });
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner = null;
          document.getElementById('scanner-container').classList.add('hidden');
        }).catch(() => {
          html5QrcodeScanner = null;
          document.getElementById('scanner-container').classList.add('hidden');
        });
      } else {
        document.getElementById('scanner-container').classList.add('hidden');
      }
    }

    // SAVE MACHINE
    async function saveMachine(e) {
      e.preventDefault();
      const code = document.getElementById('machine-code').value.trim();
      const model = document.getElementById('machine-model').value.trim();
      const status = document.getElementById('machine-status').value;
      const notes = document.getElementById('machine-notes').value.trim();

      if (!code) return;

      const machineId = 'mac_' + Date.now();
      let photoId = null;

      if (currentTempPhoto) {
        photoId = 'img_' + Date.now();
        await saveImageToDB(photoId, currentTempPhoto);
      }

      const now = new Date();
      const dateStr = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

      machines.push({
        id: machineId,
        sectorId: currentSectorId,
        code: code,
        model: model,
        status: status,
        notes: notes,
        photoId: photoId,
        date: dateStr
      });

      saveData();
      closeMachineModal();
      renderMachines();
    }

    function deleteMachine(id) {
      if (confirm("Deseja remover o registro desta máquina?")) {
        const m = machines.find(x => x.id === id);
        if (m && m.photoId) {
          deleteImageFromDB(m.photoId);
        }
        machines = machines.filter(x => x.id !== id);
        saveData();
        renderMachines();
      }
    }

    // FULL IMAGE VIEW
    function openImageView(src, title) {
      document.getElementById('full-size-image').src = src;
      document.getElementById('image-modal-title').innerText = 'Patrimônio: ' + title;
      document.getElementById('modal-image-view').classList.remove('hidden');
    }

    function closeImageView() {
      document.getElementById('modal-image-view').classList.add('hidden');
    }

    // EXPORT TO EXCEL
    function exportToExcel() {
      if (machines.length === 0) {
        alert("Nenhum dado registrado para exportar.");
        return;
      }

      const data = machines.map(m => {
        const sec = sectors.find(s => s.id === m.sectorId);
        return {
          "Setor / Local": sec ? sec.name : "Desconhecido",
          "Código / Patrimônio": m.code,
          "Modelo / Equipamento": m.model || "-",
          "Estado": m.status || "-",
          "Observações": m.notes || "-",
          "Possui Foto": m.photoId ? "Sim" : "Não",
          "Data do Registro": m.date
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(data);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Inventário de Máquinas");

      const max_width = data.reduce((w, r) => Math.max(w, r["Setor / Local"].length), 10);
      worksheet["!cols"] = [ { wch: max_width }, { wch: 20 }, { wch: 25 }, { wch: 15 }, { wch: 30 }, { wch: 12 }, { wch: 20 } ];

      const fileName = `Inventario_Maquinas_${new Date().toISOString().slice(0,10)}.xlsx`;
      XLSX.writeFile(workbook, fileName);
    }

    // BACKUP JSON
    function exportBackupJSON() {
      const backupData = {
        sectors: sectors,
        machines: machines
      };
      const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `backup_maquinas_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importBackupJSON(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const data = JSON.parse(event.target.result);
          if (data.sectors && data.machines) {
            sectors = data.sectors;
            machines = data.machines;
            saveData();
            alert("Backup restaurado com sucesso!");
            switchTab('sectors');
          } else {
            alert("Arquivo de backup inválido.");
          }
        } catch (err) {
          alert("Erro ao ler o arquivo de backup.");
        }
      };
      reader.readAsText(file);
    }

    function clearAllData() {
      if (confirm("ATENÇÃO: Isso apagará TODOS os setores e máquinas gravadas. Deseja continuar?")) {
        localStorage.clear();
        sectors = [];
        machines = [];
        if(db) {
          const tx = db.transaction("images", "readwrite");
          tx.objectStore("images").clear();
        }
        switchTab('sectors');
      }
    }
  </script>
